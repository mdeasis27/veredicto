[project]
name = "veredicto"
version = "0.1.0"
description = "Evaluation harness for LLM-powered document Q&A — retrieval metrics, judge calibration, bias audit"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veredicto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
